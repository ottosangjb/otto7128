<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำนวณค่างวดรถ</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 450px;
    margin: auto;
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

h2 {
    text-align: center;
    color: #0078d4;
}

.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #0078d4;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #005ea6;
}

.result {
    margin-top: 20px;
    background: #f8f9fa;
    border-radius: 8px;
    padding: 15px;
}

.result p {
    margin: 8px 0;
}

.monthly {
    font-size: 24px;
    color: #d83b01;
    font-weight: bold;
    text-align: center;
}
</style>

</head>
<body>

<div class="container">
    <h2>🚗 คำนวณค่างวดรถ</h2>

    <div class="form-group">
        <label>ราคารถ (บาท)</label>
        <input type="number" id="carPrice" placeholder="500000">
    </div>

    <div class="form-group">
        <label>เงินดาวน์ (%)</label>
        <select id="downPercent">
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="25">25%</option>
            <option value="30">30%</option>
            <option value="35">35%</option>
            <option value="40">40%</option>
            <option value="50">50%</option>
        </select>
    </div>

    <div class="form-group">
        <label>ดอกเบี้ยต่อปี (%)</label>
        <input type="number" id="interestRate" value="5" step="0.01">
    </div>

    <div class="form-group">
        <label>ระยะเวลาผ่อน (ปี)</label>
        <select id="years">
            <option value="1">1 ปี</option>
            <option value="2">2 ปี</option>
            <option value="3">3 ปี</option>
            <option value="4">4 ปี</option>
            <option value="5">5 ปี</option>
            <option value="6">6 ปี</option>
            <option value="7">7 ปี</option>
        </select>
    </div>

    <button onclick="calculateLoan()">คำนวณ</button>

    <div class="result" id="result" style="display:none;">
        <p id="downAmount"></p>
        <p id="financeAmount"></p>
        <p id="interestTotal"></p>
        <p id="totalPay"></p>
        <hr>
        <div class="monthly" id="monthlyPayment"></div>
    </div>
</div>

<script>
function formatNumber(num) {
    return Number(num).toLocaleString('th-TH', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function calculateLoan() {

    let carPrice = parseFloat(document.getElementById("carPrice").value);
    let downPercent = parseFloat(document.getElementById("downPercent").value);
    let interestRate = parseFloat(document.getElementById("interestRate").value);
    let years = parseFloat(document.getElementById("years").value);

    if (!carPrice || carPrice <= 0) {
        alert("กรุณาระบุราคารถ");
        return;
    }

    let downAmount = carPrice * downPercent / 100;
    let financeAmount = carPrice - downAmount;

    let interestTotal =
        financeAmount *
        (interestRate / 100) *
        years;

    let totalPay =
        financeAmount +
        interestTotal;

    let monthlyPayment =
        totalPay /
        (years * 12);

    document.getElementById("downAmount").innerHTML =
        "💰 เงินดาวน์: " + formatNumber(downAmount) + " บาท";

    document.getElementById("financeAmount").innerHTML =
        "🏦 ยอดจัดไฟแนนซ์: " + formatNumber(financeAmount) + " บาท";

    document.getElementById("interestTotal").innerHTML =
        "📈 ดอกเบี้ยรวม: " + formatNumber(interestTotal) + " บาท";

    document.getElementById("totalPay").innerHTML =
        "📋 ยอดผ่อนรวม: " + formatNumber(totalPay) + " บาท";

    document.getElementById("monthlyPayment").innerHTML =
        "ค่างวด/เดือน<br>" +
        formatNumber(monthlyPayment) +
        " บาท";

    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
